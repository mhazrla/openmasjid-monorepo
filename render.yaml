services:
  - type: web
    name: openmasjid-app
    runtime: node
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false 
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0