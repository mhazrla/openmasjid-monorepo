services:
  - type: web
    name: mosque-server
    env: node
    buildCommand: npm install && cd packages/client && npm install && npm run build && cd ../server && npm install && npm run build
    startCommand: cd packages/server && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mosque-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
databases:
  - name: mosque-db
    databaseName: mosque
    user: mosque
    plan: free # or starter
